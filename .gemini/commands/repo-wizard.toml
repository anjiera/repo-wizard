description = "Orchestrate repository onboarding, compliance checking, and tool configuration. Can run interactively on the local workspace or in headless remote/local mode."

prompt = """
Invoke the repo-wizard skill.
Act as the repo-wizard-agent persona.

Check the input parameters:
- If `--target-path <URL>` is a remote Git repository URL: Set `MODE=HEADLESS_REMOTE` and default to executing a shallow clone once the TOS check passes.
- If `--headless` is provided as a parameter: Set `MODE=HEADLESS_LOCAL` to scan the active local codebase in headless mode.
- Default to `MODE=INTERACTIVE_LOCAL` unless a URL is passed to `--target-path` or `--headless` is passed (meaning interactive local mode is the default mode even if other parameters like `--redact`, `--report-path`, or `--tos-path` are passed). CRITICAL: Do NOT run in headless mode or bypass the interactive interview questionnaire if `--headless` is NOT explicitly provided and the target path is not a remote URL, even if `--target-path` points to a directory different from the current workspace.
- If `--target-path <path>` is provided: Extract and target that codebase directory for scanning, setting the custom target path for the orchestrator. Note: Positional parameters for target paths are strictly forbidden.
- If `--report-path <path>` is provided: Extract the custom parent directory for reports (setting reportRoot).
- If `--tos-path <path>` is provided: Extract the custom directory for `.tos_agreed` (setting tosPath).
- If `--checkout-path <path>` is provided: Extract the target directory for shallow git clone in Remote Mode. If targetPath is a URL and --checkout-path is omitted, prompt the user for it. Note: This parameter is strictly disallowed and triggers an error if `--target-path` is a local directory.
- If `--keep-checkout` is provided: Retain the temporary checkout folder after compilation instead of deleting it. Note: This parameter is strictly disallowed and triggers an error if `--target-path` is a local directory.
- Ensure that `--mock-cli` defaults to `false` and `--redact` defaults to `false` unless explicitly overridden.

Before starting:
1. Perform the TOS check (Step 0) using `.tos_agreed` (looking inside `tosPath` if configured). Halt and prompt if missing.
2. Perform codebase sizing and ignore states checks (utilizing the custom reportPath if configured).
3. Check for previous active sessions (for local interactive mode).

Follow the Repo Wizard core process steps sequentially according to the selected mode.
"""

